<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSS Dashboard</title>
<meta name="description" content="KSS Platform — dashboard hub">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23BE4229%22/><text x=%2250%22 y=%2265%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22>K</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Kanit:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<!-- defer: a slow or blocked CDN must never hold up the page; line charts
     check for window.Chart and show a message if it didn't load. -->
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="/i18n-en.js"></script>
<script src="/i18n.js"></script>
<script defer src="/pos-parse.js"></script>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <button type="button" class="lang-toggle login-lang" data-no-i18n aria-label="Language / ภาษา"></button>
    <h1>KSS Dashboard</h1>
    <p class="sub">เข้าสู่ระบบเพื่อดูรายงานของคุณ</p>
    <div id="login-error" class="error-msg hidden"></div>
    <form id="login-form">
      <div class="field">
        <label for="login-email">อีเมล</label>
        <input id="login-email" type="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="login-password">รหัสผ่าน</label>
        <input id="login-password" type="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn primary block">เข้าสู่ระบบ</button>
    </form>
  </div>
</div>

<!-- FORCE CHANGE PASSWORD SCREEN -->
<div id="force-change-screen" class="login-screen hidden">
  <div class="login-card">
    <h1>ตั้งรหัสผ่านใหม่</h1>
    <p class="sub">กรุณาตั้งรหัสผ่านใหม่ก่อนใช้งานครั้งแรก</p>
    <div id="force-change-error" class="error-msg hidden"></div>
    <form id="force-change-form">
      <div class="field">
        <label for="force-new-password">รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</label>
        <input id="force-new-password" type="password" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn primary block">บันทึกรหัสผ่านใหม่</button>
    </form>
  </div>
</div>

<!-- APP SHELL -->
<div id="app-shell" class="hidden">
  <div class="topbar">
    <div class="topbar-left">
      <div class="brand">KSS <span>Dashboard</span></div>
      <!-- KSS staff: pick which company's dashboards to view -->
      <label class="company-picker-wrap hidden" id="company-picker-wrap">
        <span class="sr-only">บริษัท</span>
        <select id="company-picker" aria-label="เลือกบริษัท"></select>
      </label>
      <span id="company-name" class="company-name hidden"></span>
    </div>
    <div class="topbar-actions">
      <span id="user-display-name" class="user-display-name"></span>
      <span class="notif-wrap">
        <button id="notif-btn" type="button" class="icon-btn notif-btn" title="มีอะไรใหม่" aria-label="มีอะไรใหม่" aria-expanded="false">🔔<span id="notif-badge" class="notif-badge hidden"></span></button>
        <div id="notif-panel" class="notif-panel hidden" role="dialog" aria-label="มีอะไรใหม่"></div>
      </span>
      <button id="lang-btn" type="button" class="lang-toggle" data-no-i18n aria-label="Language / ภาษา"></button>
      <button id="open-admin-btn" class="btn small ghost hidden" title="KSS Admin Console">🏢 Admin Console</button>
      <button id="open-manage-users-btn" class="icon-btn hidden" title="จัดการผู้ใช้งาน" aria-label="จัดการผู้ใช้งาน">👥</button>
      <button id="open-settings-btn" class="icon-btn hidden" title="ตั้งค่า FMH API" aria-label="ตั้งค่า">⚙️</button>
      <button id="open-password-btn" class="icon-btn" title="เปลี่ยนรหัสผ่าน" aria-label="เปลี่ยนรหัสผ่าน">🔑</button>
      <button id="logout-btn" class="icon-btn" title="ออกจากระบบ" aria-label="ออกจากระบบ">⏻</button>
    </div>
  </div>

  <!-- Dashboard view -->
  <div id="dashboard-view">
    <div id="tabs" class="tabs" role="tablist"></div>
    <div id="tab-panel-wrap" class="tab-panel-wrap"></div>
  </div>

  <!-- KSS Internal Admin Console (kss_superadmin only) -->
  <div id="admin-view" class="admin-view hidden">
    <aside class="admin-sidebar">
      <div class="admin-side-title">บริษัทลูกค้า</div>
      <div id="admin-company-list"></div>
      <button id="admin-add-company-btn" class="btn small ghost admin-add-btn">+ เพิ่มบริษัท</button>
      <div class="admin-side-title">ระบบ</div>
      <button class="admin-nav-item" data-view="catalog">🧩 Widget Catalog</button>
      <button class="admin-nav-item" data-view="fmh">🔍 FMH Diagnostics</button>
      <button class="admin-nav-item" data-view="staff">👤 ทีม KSS</button>
      <button class="admin-nav-item" data-view="news">📣 ประกาศ (มีอะไรใหม่)</button>
    </aside>
    <main id="admin-main" class="admin-main"></main>
  </div>
</div>

<!-- SETTINGS MODAL (company admin) — this company's FMH API key -->
<div id="settings-modal" class="modal-overlay hidden">
  <div class="modal-card">
    <h2>ตั้งค่า FMH API</h2>
    <p class="helper-text" style="margin-top:0;">
      API Key จะถูกเข้ารหัสก่อนเก็บลงฐานข้อมูล และจะไม่แสดงค่าจริงอีกหลังบันทึกแล้ว
    </p>
    <div id="fmh-key-panel"></div>
    <div class="modal-close-row">
      <button class="btn ghost" id="close-settings-btn">ปิด</button>
    </div>
  </div>
</div>

<!-- MANAGE USERS MODAL (company admin) -->
<div id="manage-users-modal" class="modal-overlay hidden">
  <div class="modal-card" style="max-width:600px;">
    <h2>จัดการผู้ใช้งาน</h2>
    <div id="user-manager"></div>
    <div class="modal-close-row">
      <button class="btn ghost" id="close-manage-users-btn">ปิด</button>
    </div>
  </div>
</div>

<!-- CHANGE PASSWORD MODAL -->
<div id="password-modal" class="modal-overlay hidden">
  <div class="modal-card" style="max-width:380px;">
    <h2>เปลี่ยนรหัสผ่าน</h2>
    <div id="password-modal-error" class="error-msg hidden"></div>
    <form id="password-modal-form">
      <div class="field">
        <label for="current-password">รหัสผ่านปัจจุบัน</label>
        <input id="current-password" type="password" required autocomplete="current-password">
      </div>
      <div class="field">
        <label for="new-password">รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</label>
        <input id="new-password" type="password" required minlength="8" autocomplete="new-password">
      </div>
      <div class="modal-close-row">
        <button type="button" class="btn ghost" id="close-password-btn">ยกเลิก</button>
        <button type="submit" class="btn primary">บันทึก</button>
      </div>
    </form>
  </div>
</div>

<script src="/app.js"></script>
<script src="/admin.js"></script>
</body>
</html>
